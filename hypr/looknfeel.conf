# ==========================================================
# ОБЩИЕ НАСТРОЙКИ И СЕРО-БЕЛАЯ ОБВОДКА
# ==========================================================
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 1

    # Контрастный серо-белый градиент (будет плавно переливаться за счет borderangle)
    col.active_border = rgba(ffffffff) rgba(8a8a8aff) rgba(ffffffff) 45deg
    col.inactive_border = rgba(333333aa)

    # Позволяет менять размер окон мышкой, просто потянув за край/рамку
    resize_on_border = true
    extend_border_grab_area = 15

    allow_tearing = false
    layout = dwindle
}

# ==========================================================
# СКРУГЛЕНИЕ, МЯГКИЕ ТЕНИ И СТЕКЛЯННЫЙ BLUR
# ==========================================================
decoration {
    rounding = 8

    # Небольшая прозрачность для неактивных окон, чтобы фокус всегда был на активном
    active_opacity = 1.0
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0d0d0dcc)
        color_inactive = rgba(00000066)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.0117
        contrast = 0.95
        brightness = 0.9
        vibrancy = 0.2
        popups = true
    }
}

# ==========================================================
# ПРОКАЧАННЫЕ ПЛАВНЫЕ АНИМАЦИИ (60/144+ Hz Smooth)
# ==========================================================
animations {
    enabled = true

    # Кастомные кривые Безье для упругого и плавного движения
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    # Окна: плавный вылет с легким пружинящим эффектом
    animation = windows, 1, 5, wind, slide
    animation = windowsIn, 1, 5, winIn, popin 82%
    animation = windowsOut, 1, 4, smoothOut, popin 85%
    animation = windowsMove, 1, 5, wind, slide

    # Рамка: плавная смена цвета + бесконечное вращение серо-белого блика по периметру
    animation = border, 1, 8, default
    animation = borderangle, 1, 90, liner, loop

    # Затухание и слои (Waybar, меню, уведомления)
    animation = fade, 1, 5, smoothIn
    animation = fadeIn, 1, 5, smoothIn
    animation = fadeOut, 1, 4, smoothOut
    animation = layers, 1, 4, overshot, popin 85%
    animation = layersIn, 1, 4, overshot, popin 85%
    animation = layersOut, 1, 3, smoothOut, fade

    # Рабочие столы (в вашем старом конфиге были отключены на 0!)
    animation = workspaces, 1, 5, overshot, slidefade 20%
    animation = specialWorkspace, 1, 5, overshot, slidevert
}

# ==========================================================
# ТАЙЛИНГ И СИСТЕМНЫЕ МЕЛОЧИ
# ==========================================================
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    vrr = 1
}

# Размытие фона под панелью Waybar и меню
layerrule = blur, waybar
layerrule = ignorezero, waybar
