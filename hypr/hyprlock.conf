general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

# Размытый фон экрана
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.8
}

# Дата сверху (Wednesday, November 1)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %-d")"
    color = rgba(240, 240, 240, 0.85)
    font_size = 20
    font_family = Sans Bold
    position = 0, -110
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 2
}

# Крупные часы сверху (17:09)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = Sans Bold
    position = 0, -145
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 4
}

# Кружок аватарки снизу
shape {
    monitor =
    size = 52, 52
    color = rgba(60, 60, 60, 0.8)
    rounding = -1
    border_size = 2
    border_color = rgba(240, 240, 240, 0.9)
    position = 0, 145
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 
    color = rgba(240, 240, 240, 0.9)
    font_size = 24
    font_family = Sans
    position = 0, 155
    halign = center
    valign = bottom
}

# Имя пользователя под кружком
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 15
    font_family = Sans Bold
    position = 0, 110
    halign = center
    valign = bottom
}

# Поле ввода пароля (скрыто, появляется при нажатии на пробел/клавишу)
input-field {
    monitor =
    size = 230, 38
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(240, 240, 240, 0.95) rgba(158, 158, 158, 0.95) 45deg
    inner_color = rgba(25, 25, 25, 0.85)
    font_color = rgb(240, 240, 240)
    rounding = 12

    fade_on_empty = true
    fade_timeout = 2500

    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(200, 200, 200, 0.9)
    fail_color = rgba(255, 85, 85, 0.9)
    fail_text = <i>Wrong password</i>

    position = 0, 60
    halign = center
    valign = bottom
}

# Подпись в самом низу
label {
    monitor =
    text = Press Space or Enter Password
    color = rgba(210, 210, 210, 0.65)
    font_size = 11
    font_family = Sans
    position = 0, 30
    halign = center
    valign = bottom
}
