exec = hyprctl keyword decoration:rounding 8
exec = hyprctl keyword decoration:blur:enabled true
exec = hyprctl keyword decoration:blur:new_optimizations true
exec = hyprctl keyword decoration:blur:popups true
exec = hyprctl keyword animations:enabled true
exec = hyprctl keyword bezier smoothWorkspace,0.22,1,0.36,1
exec = hyprctl keyword animation workspaces,1,6,smoothWorkspace,slidefade 20%
exec = hyprctl keyword layerrule unset,waybar
exec = hyprctl keyword layerrule blur,waybar
exec = hyprctl keyword decoration:blur:size 6
exec = hyprctl keyword decoration:blur:passes 2
exec = hyprctl keyword decoration:active_opacity 1.0
exec = hyprctl keyword decoration:inactive_opacity 0.94
exec = hyprctl keyword general:col.active_border 'rgba(c0bfbcff) rgba(5e5c64ff) 45deg'
exec = hyprctl keyword general:col.inactive_border 'rgba(333333aa)'
exec = hyprctl keyword layerrule ignorealpha 0.2,waybar
